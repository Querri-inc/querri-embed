name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      # npm trusted publishing (OIDC): no NPM_TOKEN. Needs Node >= 22.14 and
      # npm >= 11.5.1, and a trusted publisher on npmjs.com naming this repo
      # and the workflow file `ci.yml`. Provenance is attached automatically.
      # No `registry-url`: it writes an .npmrc that expects NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes
